<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Pedidos</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#070d07;color:#e8f5e9;font-family:system-ui,sans-serif;padding:14px;font-size:13px}.hdr{text-align:center;padding:14px;margin-bottom:14px;background:#0a1a0a;border:1.5px solid #1e6b1e;border-radius:10px}.ttl{font-size:20px;font-weight:900;color:#b8e840;letter-spacing:2px}.sub{font-size:10px;color:#4a7a1e;letter-spacing:3px;margin-top:3px}.inf{font-size:12px;color:#4ade80;font-weight:700;margin-top:6px}.btn{display:block;width:100%;padding:16px;background:#16a34a;border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:900;cursor:pointer;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;text-decoration:none;text-align:center}.blk{margin-bottom:12px;border-radius:9px;overflow:hidden;border-width:1.5px;border-style:solid}.bh{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom-width:1px;border-bottom-style:solid}table{width:100%;border-collapse:collapse}tr:nth-child(even){background:rgba(255,255,255,.025)}.th th{padding:4px 10px;text-align:left;color:#374151;font-size:9px;text-transform:uppercase;background:#050d05}.f{padding:5px 10px}.g{color:#9ca3af;font-size:11px}.y{color:#fbbf24;font-size:11px}.w{font-weight:800;color:#bbf7d0}.r{text-align:right}.s{font-size:10px;color:#6b7280}.bf{padding:6px 14px;text-align:right;font-size:11px;font-weight:700}#btn{width:100%;padding:16px;background:#16a34a;border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:900;cursor:pointer;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}#btn:disabled{background:#1a4a1a;color:#4b5563;cursor:default}#msg{display:none;text-align:center;padding:12px;border-radius:8px;margin-bottom:12px;font-weight:700;font-size:14px}</style></head><body><div class="hdr"><div class="ttl">IMPORT PEDIDOS</div><div class="sub">PARRAS VALLEY · 2026</div><div class="inf" id="inf">Leyendo datos...</div></div><div id="msg"></div><button id="btn" onclick="guardar()" disabled>Importar a Firebase</button><div id="bloques"></div><script>var FB="https://parrasvalley-default-rtdb.firebaseio.com";var DIAS=["Vie","Sab","Dom","Lun","Mar","Mie","Jue"];var DC={Mie:"#b8e840",Jue:"#60a5fa",Vie:"#f97316"};var FC={"Persa":"#4ade80","Persa OG":"#22c55e","Minibel":"#e07070","Minibel OG":"#ef4444","Slicer OG":"#84a020","Slicer":"#a8c840","Europeo":"#5ab88a","Euro ORG":"#3a9960","Bell OG":"#f97316"};var DATA=null,SEM=null;function dec(s){  s=s.replace(/-/g,"+").replace(/_/g,"/");  while(s.length%4)s+="=";  return atob(s);}function init(){  var h=location.hash.slice(1);  if(!h){document.getElementById("inf").textContent="Sin datos en URL";return;}  try{    var obj=JSON.parse(dec(h));    DATA=obj.p;SEM=obj.s;    var tot=DATA.reduce(function(s,p){return s+p.cajas;},0);    document.getElementById("inf").textContent="Semana "+SEM+" · "+DATA.length+" pedidos · "+tot.toLocaleString()+" cajas";    document.getElementById("btn").disabled=false;    var pd={};DATA.forEach(function(p){if(!pd[p.dia])pd[p.dia]=[];pd[p.dia].push(p);});    var html="";    DIAS.forEach(function(dia){      if(!pd[dia])return;      var rows=pd[dia],t=rows.reduce(function(s,r){return s+r.cajas;},0),c=DC[dia]||"#888";      var f=rows.map(function(r){return"<tr><td class='f' style='color:"+(FC[r.fruta]||"#aaa")+"'>"+r.fruta+"</td><td class='f g'>"+r.pres+"</td><td class='f y'>#"+r.cal+"</td><td class='f w r'>"+r.cajas.toLocaleString()+"</td><td class='f g s'>"+r.cliente+"</td></tr>";}).join("");      html+="<div class='blk' style='border-color:"+c+"55'><div class='bh' style='background:"+c+"15;border-color:"+c+"33'><b style='color:"+c+";font-size:15px;letter-spacing:2px'>"+dia.toUpperCase()+"</b><span style='color:"+c+";font-size:12px'>"+rows.length+" ped · "+t.toLocaleString()+" cj</span></div><table><tr class='th'><th>Fruta</th><th>Pres</th><th>Cal</th><th class='r'>Cajas</th><th>Cliente</th></tr>"+f+"</table><div class='bf' style='color:"+c+"'>Total "+dia+": "+t.toLocaleString()+" cajas</div></div>";    });    document.getElementById("bloques").innerHTML=html;  }catch(e){document.getElementById("inf").textContent="Error: "+e.message;}}function guardar(){  var btn=document.getElementById("btn"),msg=document.getElementById("msg");  btn.disabled=true;btn.textContent="Importando...";  msg.style.display="block";msg.style.background="rgba(251,191,36,.15)";msg.style.color="#fbbf24";  msg.textContent="Guardando en Firebase...";  fetch(FB+"/campo-proy-semanas-v1/"+SEM+"/ped.json",    {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DATA)})  .then(function(r){    if(r.ok){msg.style.background="rgba(34,197,94,.15)";msg.style.color="#4ade80";      msg.textContent="Listo - "+DATA.length+" pedidos guardados";btn.textContent="Importado";}    else{msg.style.background="rgba(239,68,68,.15)";msg.style.color="#ef4444";      msg.textContent="Error "+r.status;btn.disabled=false;btn.textContent="Reintentar";}  }).catch(function(e){    msg.style.background="rgba(239,68,68,.15)";msg.style.color="#ef4444";    msg.textContent="Error: "+e.message;btn.disabled=false;btn.textContent="Reintentar";  });}init();</script></body></html>
