<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Pedidos</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#070d07;color:#e8f5e9;font-family:system-ui,sans-serif;padding:14px;font-size:13px}tr:nth-child(even){background:rgba(255,255,255,.025)}#btn{width:100%;padding:15px;background:#16a34a;border:none;border-radius:10px;color:#fff;font-size:17px;font-weight:900;cursor:pointer;margin-bottom:14px;display:block}#btn:disabled{background:#1a4a1a;color:#374151}#msg{display:none;text-align:center;padding:12px;border-radius:8px;margin-bottom:12px;font-weight:700;font-size:14px}</style>
</head><body>
<div style="text-align:center;padding:14px;margin-bottom:14px;background:#0a1a0a;border:1.5px solid #1e6b1e;border-radius:10px">
  <div style="font-size:20px;font-weight:900;color:#b8e840;letter-spacing:2px">IMPORT PEDIDOS</div>
  <div style="font-size:10px;color:#4a7a1e;letter-spacing:3px;margin-top:2px">PARRAS VALLEY 2026</div>
  <div style="font-size:12px;color:#4ade80;font-weight:700;margin-top:6px" id="inf">Cargando...</div>
</div>
<div id="msg"></div>
<button id="btn" onclick="guardar()" disabled>Confirmar e importar a Firebase</button>
<div id="contenido"></div>
<script>
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var DIAS=["Vie","Sab","Dom","Lun","Mar","Mie","Jue"];
var DC={Mie:"#b8e840",Jue:"#60a5fa",Vie:"#f97316"};
var FC={"Persa":"#4ade80","Persa OG":"#22c55e","Minibel":"#e07070","Minibel OG":"#ef4444","Slicer OG":"#84a020","Europeo":"#5ab88a","Euro ORG":"#3a9960","Bell OG":"#f97316"};
var DATA=null,SEM=null;
function dec(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  return atob(s);
}
function init(){
  var h=location.hash.slice(1);
  if(!h){document.getElementById("inf").textContent="Abre desde abrir-pedidos";return;}
  try{
    var obj=JSON.parse(dec(h));
    DATA=obj.p;SEM=obj.s;
    var tot=DATA.reduce(function(s,p){return s+p.cajas;},0);
    document.getElementById("inf").textContent="Sem "+SEM+" · "+DATA.length+" ped · "+tot.toLocaleString()+" cj";
    document.getElementById("btn").disabled=false;
    var pd={};DATA.forEach(function(p){if(!pd[p.dia])pd[p.dia]=[];pd[p.dia].push(p);});
    var html="";
    DIAS.forEach(function(dia){
      if(!pd[dia])return;
      var rows=pd[dia],t=rows.reduce(function(s,r){return s+r.cajas;},0),c=DC[dia]||"#888";
      var f=rows.map(function(r){return'<tr><td style="padding:5px 10px;font-weight:700;color:'+(FC[r.fruta]||"#aaa")+'">'+r.fruta+'</td><td style="padding:5px 10px;color:#9ca3af;font-size:11px">'+r.pres+'</td><td style="padding:5px 10px;color:#fbbf24">#'+r.cal+'</td><td style="padding:5px 10px;font-weight:800;color:#bbf7d0;text-align:right">'+r.cajas.toLocaleString()+'</td><td style="padding:5px 10px;color:#6b7280;font-size:10px">'+r.cliente+'</td></tr>';}).join("");
      html+='<div style="margin-bottom:12px;border-radius:9px;overflow:hidden;border:1.5px solid '+c+'44"><div style="padding:9px 14px;display:flex;justify-content:space-between;background:'+c+'15;border-bottom:1px solid '+c+'33"><b style="color:'+c+';font-size:15px;letter-spacing:2px">'+dia.toUpperCase()+'</b><span style="color:'+c+';font-size:12px">'+rows.length+' ped · '+t.toLocaleString()+' cj</span></div><table style="width:100%;border-collapse:collapse"><tr style="background:#050d05"><th style="padding:4px 10px;text-align:left;color:#374151;font-size:9px">FRUTA</th><th style="padding:4px 10px;text-align:left;color:#374151;font-size:9px">PRES</th><th style="padding:4px 10px;color:#374151;font-size:9px">CAL</th><th style="padding:4px 10px;text-align:right;color:#374151;font-size:9px">CAJAS</th><th style="padding:4px 10px;text-align:left;color:#374151;font-size:9px">CLIENTE</th></tr>'+f+'</table><div style="padding:5px 14px;text-align:right;font-size:11px;font-weight:700;color:'+c+'">Total: '+t.toLocaleString()+'</div></div>';
    });
    document.getElementById("contenido").innerHTML=html;
  }catch(e){document.getElementById("inf").textContent="Error: "+e.message;}
}
function guardar(){
  var btn=document.getElementById("btn"),msg=document.getElementById("msg");
  btn.disabled=true;btn.textContent="Importando...";
  msg.style.display="block";msg.style.background="rgba(251,191,36,.15)";msg.style.color="#fbbf24";
  msg.textContent="Guardando en Firebase...";
  fetch(FB+"/campo-proy-semanas-v1/"+SEM+"/ped.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DATA)})
  .then(function(r){
    if(r.ok){msg.style.background="rgba(34,197,94,.15)";msg.style.color="#4ade80";msg.textContent="Listo - "+DATA.length+" pedidos guardados";btn.textContent="Importado";}
    else{msg.style.background="rgba(239,68,68,.15)";msg.style.color="#ef4444";msg.textContent="Error "+r.status;btn.disabled=false;btn.textContent="Reintentar";}
  }).catch(function(e){msg.style.background="rgba(239,68,68,.15)";msg.style.color="#ef4444";msg.textContent="Error: "+e.message;btn.disabled=false;btn.textContent="Reintentar";});
}
init();
</script>
</body></html>
