<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar Pedidos - PVT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a120a;color:#e0ead0;font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.04);border:2px solid rgba(134,200,122,.3);border-radius:16px;padding:24px;width:100%;max-width:440px}
h1{color:#86c87a;font-size:18px;margin-bottom:16px}
.dia{color:#fbbf24;font-size:11px;font-weight:900;letter-spacing:1.5px;margin:12px 0 6px;text-transform:uppercase}
.row{display:grid;grid-template-columns:90px 1fr auto auto;gap:6px;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.fr{font-weight:700}
.cl{color:#6b7280;font-size:10px}
.cj{color:#f0ede8;font-weight:800;text-align:right}
#btn{width:100%;padding:16px;background:linear-gradient(135deg,#14532d,#16a34a);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:20px}
#btn:disabled{background:#1a2e1a;color:#4a6a3a;cursor:not-allowed}
#ok{color:#4ade80;font-size:13px;text-align:center;margin-top:10px;display:none}
#err{color:#ef4444;font-size:11px;text-align:center;margin-top:8px;display:none}
</style></head>
<body><div class="card">
<h1>Importar Pedidos — Lun·Mar·Mié·Jue</h1>
<div id="contenido"></div>
<button id="btn" onclick="guardar()">Guardar en Firebase</button>
<div id="ok"></div>
<div id="err"></div>
</div>
<script>
var FB="https://parrasvalley-default-rtdb.firebaseio.com/campo-proy-semanas-v1";
var DIAS=["Viernes", "Sabado", "Domingo", "Lunes", "Martes", "Miercoles", "Jueves"];
var COL={"Persa": "#86c87a", "Slicer": "#a8c840", "Europeo": "#5ab88a", "Minibel": "#e07070", "Morron": "#ef4444"};
var SEM="2026-07-24";
var DATA={"3":{"0":{"cliente":"MUCCI","dia":"Lunes","pres":"20 LBS XF","pallets":24,"cajas":1920,"fruta":"PERSA OG","cal":"#1","frontera":"MC ALLEN"},"1":{"cliente":"NATURE SWEET","dia":"Lunes","pres":"12X8OZ","pallets":2,"cajas":288,"fruta":"MINI BELL OG","cal":"#1","frontera":"MC ALLEN"},"2":{"cliente":"LIPMAN","dia":"Lunes","pres":"BUSHEL","pallets":2,"cajas":98,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"3":{"cliente":"LIPMAN","dia":"Lunes","pres":"12CT CV","pallets":6,"cajas":960,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"4":{"cliente":"LIPMAN","dia":"Lunes","pres":"12CT CV","pallets":1,"cajas":120,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"5":{"cliente":"LIPMAN","dia":"Lunes","pres":"20 LBS XF","pallets":1,"cajas":88,"fruta":"PERSA","cal":"#1","frontera":"NOGALES"},"6":{"cliente":"LIPMAN","dia":"Lunes","pres":"20 LBS MDL","pallets":5,"cajas":440,"fruta":"PERSA","cal":"#2","frontera":"NOGALES"},"7":{"cliente":"DQP","dia":"Lunes","pres":"12CT","pallets":4,"cajas":400,"fruta":"EURO ORG","cal":"#1","frontera":"NOGALES"},"8":{"cliente":"DQP","dia":"Lunes","pres":"12X1 LB","pallets":4,"cajas":400,"fruta":"PERSA OG","cal":"#1","frontera":"NOGALES"},"9":{"cliente":"DQP","dia":"Lunes","pres":"12X1 LB RPC","pallets":10,"cajas":1050,"fruta":"PERSA","cal":"#1","frontera":"NOGALES"},"10":{"cliente":"WHOLESUM","dia":"Lunes","pres":"12CT","pallets":4,"cajas":400,"fruta":"EURO ORG","cal":"#1","frontera":"NOGALES"},"11":{"cliente":"WHOLESUM","dia":"Lunes","pres":"12X1 LBS STO","pallets":6,"cajas":576,"fruta":"PERSA OG","cal":"#1","frontera":"NOGALES"},"12":{"cliente":"WHOLESUM","dia":"Lunes","pres":"50 LBS","pallets":10,"cajas":420,"fruta":"SLICER OG","cal":"#1","frontera":"NOGALES"},"13":{"cliente":"WHOLESUM","dia":"Lunes","pres":"25 LBS","pallets":5,"cajas":400,"fruta":"SLICER OG","cal":"#1","frontera":"NOGALES"}},"4":{"0":{"cliente":"PERO FAMILY","dia":"Martes","pres":"12X1 LB ORG","pallets":10,"cajas":1200,"fruta":"PERSA OG","cal":"#1","frontera":"MC ALLEN"},"1":{"cliente":"PERO FAMILY","dia":"Martes","pres":"36CT OG SUPER SELECT","pallets":9,"cajas":720,"fruta":"SLICER OG","cal":"#1","frontera":"MC ALLEN"},"2":{"cliente":"PERO FAMILY","dia":"Martes","pres":"24CT XL OG RED","pallets":5,"cajas":400,"fruta":"BELL OG","cal":"#1","frontera":"MC ALLEN"},"3":{"cliente":"PERO FAMILY","dia":"Martes","pres":"25LB OG GREEN","pallets":2,"cajas":98,"fruta":"BELL OG","cal":"#1","frontera":"MC ALLEN"},"4":{"cliente":"LAKEWAY","dia":"Martes","pres":"24S RPC","pallets":9,"cajas":720,"fruta":"EURO","cal":"#1","frontera":"MC ALLEN"}},"5":{"0":{"cliente":"LIPMAN","dia":"Miercoles","pres":"BUSHEL","pallets":2,"cajas":98,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"1":{"cliente":"LIPMAN","dia":"Miercoles","pres":"12CT CV","pallets":6,"cajas":960,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"2":{"cliente":"LIPMAN","dia":"Miercoles","pres":"12CT CV","pallets":1,"cajas":120,"fruta":"EURO","cal":"#1","frontera":"NOGALES"},"3":{"cliente":"WHOLESUM","dia":"Miercoles","pres":"12CT","pallets":2,"cajas":320,"fruta":"EURO ORG","cal":"#1","frontera":"NOGALES"},"4":{"cliente":"WHOLESUM","dia":"Miercoles","pres":"12X1 LBS STO","pallets":6,"cajas":576,"fruta":"PERSA OG","cal":"#1","frontera":"NOGALES"},"5":{"cliente":"WHOLESUM","dia":"Miercoles","pres":"50 LBS","pallets":9,"cajas":378,"fruta":"SLICER OG","cal":"#1","frontera":"NOGALES"},"6":{"cliente":"4 EARTH FARMS","dia":"Miercoles","pres":"8X2 LBS","pallets":10,"cajas":960,"fruta":"PERSA","cal":"#1","frontera":"NOGALES"},"7":{"cliente":"4 EARTH FARMS","dia":"Miercoles","pres":"12X1 LB","pallets":3,"cajas":288,"fruta":"PERSA OG","cal":"#1","frontera":"NOGALES"},"8":{"cliente":"4 EARTH FARMS","dia":"Miercoles","pres":"18CT","pallets":5,"cajas":600,"fruta":"SLICER OG","cal":"#1","frontera":"NOGALES"},"9":{"cliente":"4 EARTH FARMS","dia":"Miercoles","pres":"12CT OG","pallets":1,"cajas":120,"fruta":"EURO ORG","cal":"#1","frontera":"NOGALES"},"10":{"cliente":"WHOLESUM","dia":"Miercoles","pres":"25 LBS","pallets":5,"cajas":400,"fruta":"SLICER OG","cal":"#1","frontera":"NOGALES"}},"6":{"0":{"cliente":"LAKEWAY","dia":"Jueves","pres":"24S RPC","pallets":10,"cajas":800,"fruta":"EURO","cal":"#1","frontera":"MC ALLEN"},"1":{"cliente":"LAKEWAY","dia":"Jueves","pres":"12X1 LB CV","pallets":7,"cajas":840,"fruta":"PERSA","cal":"#2","frontera":"MC ALLEN"},"2":{"cliente":"LAKEWAY","dia":"Jueves","pres":"20 LBS XF","pallets":2,"cajas":128,"fruta":"PERSA","cal":"#1","frontera":"MC ALLEN"},"3":{"cliente":"LAKEWAY","dia":"Jueves","pres":"36CT OG","pallets":2,"cajas":160,"fruta":"SLICER OG","cal":"#1","frontera":"MC ALLEN"},"4":{"cliente":"NATURE SWEET","dia":"Jueves","pres":"12X8OZ","pallets":3,"cajas":432,"fruta":"MINI BELL OG","cal":"#1","frontera":"MC ALLEN"}}};

// Leer params de URL
(function(){
  try{
    var raw=location.search.replace(/^\?/,"").split("&").reduce(function(a,p){var kv=p.split("=");a[decodeURIComponent(kv[0])]=decodeURIComponent(kv.slice(1).join("="));return a;},{});
    if(raw.import)DATA=JSON.parse(raw.import);
    if(raw.sem)SEM=raw.sem;
    if(raw.auto==="1")setTimeout(guardar,1500);
  }catch(e){}

  var html="";
  Object.keys(DATA).forEach(function(di){
    var rows=Object.values(DATA[di]);
    var total=rows.reduce(function(s,r){return s+(r.cajas||0);},0);
    html+='<div class="dia">'+DIAS[parseInt(di)]+' — '+rows.length+' líneas · '+total.toLocaleString()+' cj</div>';
    rows.forEach(function(r){
      var fr=(r.fruta||"");
      var clr=fr.indexOf("PERSA")>=0?"#86c87a":fr.indexOf("SLICER")>=0?"#a8c840":fr.indexOf("EURO")>=0?"#5ab88a":fr.indexOf("BELL")>=0||fr.indexOf("MORRON")>=0?"#ef4444":"#e07070";
      html+='<div class="row"><span class="fr" style="color:'+clr+'">'+fr+'</span><span>'+r.pres+' · '+r.cal+'</span><span class="cj">'+(r.cajas||0).toLocaleString()+'</span><span class="cl">'+(r.cliente||"")+'</span></div>';
    });
  });
  document.getElementById("contenido").innerHTML=html;
  document.getElementById("btn").disabled=false;
})();

function guardar(){
  var btn=document.getElementById("btn");
  var ok=document.getElementById("ok");
  var err=document.getElementById("err");
  if(!btn||!DATA)return;
  btn.disabled=true;btn.textContent="Guardando...";
  ok.style.display="none";err.style.display="none";
  fetch(FB+"/"+SEM+"/ped.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DATA)})
  .then(function(r){
    if(r.ok){btn.textContent="✓ Guardado";ok.textContent="✓ Guardado. Ve a proyeccion-empaque → Jalar pedidos.";ok.style.display="block";}
    else{err.textContent="Error HTTP "+r.status;err.style.display="block";btn.disabled=false;btn.textContent="Reintentar";}
  })
  .catch(function(e){err.textContent="Error: "+e.message;err.style.display="block";btn.disabled=false;btn.textContent="Reintentar";});
}
</script></body></html>
