<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar Pedidos - PVT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a120a;color:#e0ead0;font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.04);border:2px solid rgba(134,200,122,.3);border-radius:16px;padding:24px;width:100%;max-width:440px}
h1{color:#86c87a;font-size:18px;margin-bottom:4px}
.sub{color:#4a6a3a;font-size:12px;margin-bottom:20px}
.dia{color:#fbbf24;font-size:11px;font-weight:900;letter-spacing:1.5px;margin:12px 0 6px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row span:first-child{color:#a0b090}
.row b{color:#e0ead0}
.cult{color:#86c87a;font-size:10px;font-weight:900;letter-spacing:1px;margin-top:8px;margin-bottom:3px}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;color:#ef4444;font-size:13px;margin-top:16px;display:none}
.ok{background:rgba(134,200,122,.1);border:1px solid rgba(134,200,122,.3);border-radius:8px;padding:14px;color:#86c87a;font-size:14px;font-weight:900;text-align:center;margin-top:16px;display:none}
#btn{width:100%;padding:16px;background:linear-gradient(135deg,#14532d,#16a34a);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:20px}
#btn:disabled{background:#1a2e1a;color:#4a6a3a;cursor:not-allowed}
.empty{text-align:center;padding:30px;color:#4a6a3a;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>Importar Pedidos</h1>
  <div class="sub">Parras Valley Tomatoes - Proyeccion de empaque</div>
  <div id="contenido"><div class="empty">Cargando pedidos...</div></div>
  <div class="err" id="err"></div>
  <div class="ok" id="ok">Pedidos guardados correctamente en proyeccion-empaque</div>
  <button id="btn" onclick="guardar()" disabled>Guardar en proyeccion-empaque</button>
</div>
<script>
var FB="https://parrasvalley-default-rtdb.firebaseio.com/campo-proy-semanas-v1";
var DIAS=["Viernes","Sabado","Domingo","Lunes","Martes","Miercoles","Jueves"];
var COL={Persa:"#86c87a",Slicer:"#a8c840",Europeo:"#5ab88a",Minibel:"#e07070",Morron:"#ef4444"};

function getSem(){
  var d=new Date(),dia=d.getDay(),diff=dia>=5?dia-5:dia+2;
  var ini=new Date(d);ini.setDate(d.getDate()-diff);
  return ini.toISOString().split("T")[0];
}

var DATA=null;
var SEM=null;

// Leer datos del URL
(function(){
  try{
    var raw=location.search.replace(/^\?/,"").split("&").reduce(function(acc,p){
      var kv=p.split("=");
      acc[decodeURIComponent(kv[0])]=decodeURIComponent(kv.slice(1).join("="));
      return acc;
    },{});
    if(raw.import) DATA=JSON.parse(raw.import);
    if(raw.sem) SEM=raw.sem;
    if(!SEM) SEM=getSem();
  }catch(e){
    DATA=null;
  }

  var div=document.getElementById("contenido");
  if(!DATA||!Object.keys(DATA).length){
    div.innerHTML='<div class="empty">No hay pedidos en el link.<br>Pide a Claude un link nuevo.</div>';
    return;
  }

  // Mostrar resumen
  var html="<div style='font-size:11px;color:#4a6a3a;margin-bottom:4px'>Semana: "+SEM+"</div>";
  Object.keys(DATA).forEach(function(di){
    html+='<div class="dia">'+DIAS[parseInt(di)]+'</div>';
    var cults=DATA[di];
    Object.keys(cults).forEach(function(cult){
      var color=COL[cult]||"#86c87a";
      html+='<div class="cult" style="color:'+color+'">'+cult+'</div>';
      function flat(obj,path){
        Object.keys(obj).forEach(function(k){
          var v=obj[k];
          if(v!==null&&typeof v==="object"){flat(v,path?path+"."+k:k);}
          else{html+='<div class="row"><span>'+path+"."+k+'</span><b>'+v+'</b></div>';}
        });
      }
      flat(cults[cult],"");
    });
  });
  div.innerHTML=html;
  document.getElementById("btn").disabled=false;
})();

async function guardar(){
  var btn=document.getElementById("btn");
  var err=document.getElementById("err");
  var ok=document.getElementById("ok");
  btn.disabled=true; btn.textContent="Guardando...";
  err.style.display="none"; ok.style.display="none";
  try{
    var reqs=[];
    Object.keys(DATA).forEach(function(di){
      Object.keys(DATA[di]).forEach(function(cult){
        var url=FB+"/"+SEM+"/ped/"+di+"/"+cult+".json";
        reqs.push(fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DATA[di][cult])}));
      });
    });
    var res=await Promise.all(reqs);
    var ok2=res.every(function(r){return r.ok||r.status===200||r.status===204;});
    if(ok2){ok.style.display="block";btn.textContent="Guardado";}
    else throw new Error("Firebase respondio: "+res.map(function(r){return r.status;}).join(","));
  }catch(e){
    err.textContent="Error: "+e.message;
    err.style.display="block";
    btn.disabled=false;
    btn.textContent="Reintentar";
  }
}
</script>
</body>
</html>
